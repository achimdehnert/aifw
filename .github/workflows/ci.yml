# ci.yml — Thin-Caller auf das ADR-226-Reusable (platform ADR-266 Stufe 2b).
# Semantik (Lint, Secret-Scan, Test+Coverage, Build+Artefakt-Scan, pip-audit)
# lebt zentral in iilgmbh/shared-ci/.github/workflows/_ci-pypi.yml — Verbesserungen
# erreichen alle Pakete in O(1). Inputs abgeleitet aus der Vorgänger-ci.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # 2026-08-19 bis 2026-08-25 stand hier `achimdehnert/iilgmbh/shared-ci/...`:
    # ein Pfadteil zu viel, wo GitHub `owner/repo` erwartet. Der Lauf scheiterte
    # dann VOR jedem Job („workflow file issue") — kein Test, kein Lint, und auf
    # PRs meldete `gh pr checks` „no checks reported", was wie Ruhe aussieht und
    # „hier prueft nichts" heisst. In dem Fenster ging 0.13.0 nach PyPI (#53).
    # Pin wie in iil-reflex nach demselben Sweep — nicht `@main`.
    uses: iilgmbh/shared-ci/.github/workflows/_ci-pypi.yml@v1.1.17
    with:
      python_versions: '["3.12"]'
      install_extra: 'dev'
      test_path: 'tests/'
